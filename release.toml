allow-branch = ["main"]
shared-version = true
consolidate-commits = true

pre-release-commit-message = "chore: release {{version}}"
pre-release-replacements = [
  { file = "../package.json", search = '"version": "[^"]+"', replace = '"version": "{{version}}"', exactly = 1 },
  { file = "../app/package.json", search = '"version": "[^"]+"', replace = '"version": "{{version}}"', exactly = 1 },
  { file = "../webui/package.json", search = '"version": "[^"]+"', replace = '"version": "{{version}}"', exactly = 1 },
  { file = "../core/pyproject.toml", search = '(?m)^version = "[^"]+"', replace = 'version = "{{version}}"', exactly = 1 },
  { file = "../web/pyproject.toml", search = '(?m)^version = "[^"]+"', replace = 'version = "{{version}}"', exactly = 1 },
  { file = "../web/pyproject.toml", search = 'fora==[^"]+', replace = "fora=={{version}}", exactly = 1 },
]

tag-name = "v{{version}}"
tag-message = "chore: release {{version}}"
sign-commit = true
sign-tag = true

publish = false
