[project]
name = "huddol"
version = "0.0.8"
description = "Run your own organization of agents."
requires-python = ">=3.13"
authors = [{ name = "ImFeH2", email = "i@feh2.im" }]
dependencies = [
  "aiohttp>=3.12.0",
  "httpx>=0.28.1",
  "numpy>=2.5.3",
  "opentelemetry-exporter-otlp-proto-http>=1.44.0",
  "opentelemetry-sdk>=1.44.0",
  "pillow>=11.3.0",
  "psutil>=7.2.2",
  "pydantic-ai-slim[anthropic,duckduckgo,google,openai]>=2.28.0",
  "soxr>=1.1.0",
  "websockets>=16.1.1",
]

[project.scripts]
huddol = "huddol.__main__:main"

[dependency-groups]
dev = [
  "import-linter>=2.14",
  "mypy>=2.3.1",
  "pyinstaller>=6.21.0",
  "pytest>=9.1.1",
  "ruff>=0.16.0",
  "types-psutil>=7.2.2.20260827",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"
