[project]
name = "fora-web"
version = "0.0.9"
description = "Browser interface for Fora."
requires-python = ">=3.13"
authors = [{ name = "ImFeH2", email = "i@feh2.im" }]
dependencies = ["fora==0.0.9"]

[project.scripts]
fora-web = "fora_web.__main__:run"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
